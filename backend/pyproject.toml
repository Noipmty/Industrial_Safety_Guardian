[project]
name = "gongan-weishi-backend"
version = "0.1.0"
description = "工安卫士 — 工业安全生产 AI 助手平台后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.14",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "pymilvus>=2.4",
    "redis>=5.2",
    "celery>=5.4",
    "neo4j>=5.25",
    "passlib[bcrypt]>=1.7",
    "pyjwt>=2.9",
    "python-multipart>=0.0.17",
    "python-json-logger>=3.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "prometheus-client>=0.20",
    "langfuse>=3.0",
    # BGE-M3 本地嵌入（Docker 镜像内必须安装；torch 通过 CPU 源预装以避免拉取 CUDA 版）
    "torch>=2.3",
    "FlagEmbedding>=1.3",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "basedpyright>=1.19",
    "fakeredis>=2.24",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle 错误
    "W",   # pycodestyle 警告
    "F",   # pyflakes
    "I",   # isort（导入排序）
    "B",   # flake8-bugbear
    "UP",  # pyupgrade（语法升级）
    "S",   # flake8-bandit（安全检查）
]
ignore = [
    "S101",  # 测试中允许使用 assert
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.basedpyright]
include = ["app", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["celery.*", "pymilvus", "FlagEmbedding", "fitz"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
