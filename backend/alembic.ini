# Alembic configuration for the GonganWeiShi backend (ASCII only - Windows
# reads this file with the locale encoding, so non-ASCII comments break it).
# The sqlalchemy.url below is a placeholder; the actual URL is injected
# at runtime by alembic/env.py from app.config (settings.MYSQL_URL).

[alembic]
script_location = alembic
sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
