global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # FastAPI 后端 /metrics（后端跑在宿主机或容器时都经宿主机 8000 暴露）
  - job_name: "gongan-backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: backend
          env: dev

  # 自监控
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
