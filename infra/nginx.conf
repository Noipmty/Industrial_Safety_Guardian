upstream backend {
    # compose 网络内通过服务名解析（127.0.0.1 在 nginx 容器内指向自身，会导致 /api 502）
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm image/svg+xml;
    gzip_vary on;
    gzip_proxied any;

    # 健康检查与指标（不缓冲，仅内部使用）
    location = /health {
        proxy_pass http://backend;
        access_log off;
    }

    location = /metrics {
        proxy_pass http://backend;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;  # docker 网络
        deny all;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        gzip_static on;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
