# 工安卫士 — 阿里云 ECS 生产部署编排（4核8G 适配）
#
# 与 docker-compose.yml（本地开发版）的差异：
#   1. 中间件端口全部绑定 127.0.0.1，公网仅暴露 80（配合安全组仅放行 22/80）
#   2. backend 去掉 ../backend/app 开发热挂载；worker 数降为 1（4C8G 内存约束）
#   3. BGE-M3 模型从宿主机 ../models/bge-m3 挂载进容器（模型不入镜像、不入 Git）
#   4. nginx 改为构建 frontend 镜像（多阶段内置 npm build，服务器无需装 Node / 无需上传 dist）
#   5. etcd 走 DaoCloud quay 镜像源，规避国内直连 quay.io 超时
#   6. Prometheus 抓取容器内 backend:8000（不再依赖 host.docker.internal）
#
# 用法（在 infra/ 目录下）：
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  mysql:
    image: mysql:8.0.43
    container_name: gongan-mysql
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: gongan2024
      MYSQL_DATABASE: gongan_weishi
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - gongan-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pgongan2024"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: gongan-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - gongan-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  etcd:
    image: quay.m.daocloud.io/coreos/etcd:v3.5.14
    container_name: gongan-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command:
      - etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    ports:
      - "127.0.0.1:2379:2379"
    volumes:
      - etcd_data:/etcd
    networks:
      - gongan-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: gongan-minio
    command: minio server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - gongan-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: gongan-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - gongan-net
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26
    container_name: gongan-neo4j
    environment:
      NEO4J_AUTH: neo4j/gongan2024
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - gongan-net
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p gongan2024 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: gongan-postgres
    environment:
      POSTGRES_DB: gongan_memory
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: gongan2024
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gongan-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gongan_memory"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 应用服务（FastAPI + Gunicorn + Uvicorn）
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: gongan-backend
    env_file:
      - ../.env
    environment:
      MYSQL_URL: mysql+aiomysql://root:gongan2024@mysql:3306/gongan_weishi
      REDIS_URL: redis://redis:6379/0
      MILVUS_URI: http://milvus:19530
      NEO4J_URI: bolt://neo4j:7687
      POSTGRES_URL: postgresql+asyncpg://postgres:gongan2024@postgres:5432/gongan_memory
      GUNICORN_BIND: 0.0.0.0:8000
      # 4核8G：单 worker（每个 worker 惰性加载一份 BGE-M3，约 2.5GB 内存）
      GUNICORN_WORKERS: "1"
      BGE_M3_PATH: /models/bge-m3
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../backend/uploads:/app/uploads
      - ../models/bge-m3:/models/bge-m3:ro
    networks:
      - gongan-net
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Nginx 反向代理 + 静态前端（多阶段构建内含 npm build，无需宿主机 Node）
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: gongan-nginx
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - gongan-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # 可观测性：Prometheus + Grafana（仅绑定本机，SSH 隧道访问）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gongan-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - gongan-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: gongan-grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: gongan2024
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - gongan-net
    restart: unless-stopped

networks:
  gongan-net:
    driver: bridge
    name: gongan-net

volumes:
  mysql_data:
  redis_data:
  minio_data:
  neo4j_data:
  postgres_data:
  etcd_data:
  milvus_data:
  prometheus_data:
  grafana_data:
