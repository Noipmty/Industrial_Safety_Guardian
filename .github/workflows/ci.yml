name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Type check (basedpyright)
        working-directory: backend
        run: uv run basedpyright

      - name: Run tests
        working-directory: backend
        run: uv run pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm run test

  eval-gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install eval dependencies
        working-directory: backend
        run: uv sync

      - name: Run RAGAS evaluation gate
        working-directory: eval
        env:
          API_URL: http://localhost:8000
        run: |
          echo "P0: eval gate placeholder - will be fully implemented in P7"
          python run_ragas.py --api-url ${API_URL} --check-baseline || echo "Eval gate is placeholder in P0"
